name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Still no build step -- this just stamps the commit into index.html's
      # ?v= cache-busting queries, so a deploy can't leave a browser running
      # new HTML against JS/CSS still inside its ten-minute max-age.
      - name: Stamp build version
        run: sed -i "s/__BUILD__/${GITHUB_SHA:0:12}/g" index.html
      # The repo root is the site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
